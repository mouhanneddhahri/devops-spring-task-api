name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: BUILD JAVA & TEST
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

  # JOB2:SAST (Sécurité du code statique)
  codeql-analysis:
    name: "SAST - CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # JOB 3: BUILD DOCKER & PUSH
  build-and-push-docker:
    needs: build-and-test # Attend que les tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: mouhanneddhahri/task-api:latest

  # JOB 4: DAST (Sécurité dynamique - Scanner l'app qui tourne)
  dast-scan:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # On lance le conteneur pour pouvoir le scanner
      - name: Run Docker Container
        run: |
          docker run -d -p 8080:8080 --name task-api mouhanneddhahri/task-api:latest
          sleep 10 # Attendre que Spring Boot démarre bien

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          # On configure pour ne pas fail le build sur des warnings mineurs (optionnel)
          allow_issue_writing: false